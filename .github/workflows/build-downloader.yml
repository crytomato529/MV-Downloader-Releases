name: Build minimal Windows downloader

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  downloader:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.15.0'
      - name: Build, inspect and test pinned standalone downloader
        shell: pwsh
        run: python scripts/build-downloader.py
      - name: Upload Windows downloader
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yt-dlp-win64-tools
          path: dist/downloader/tools/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload complete corresponding inputs and build material
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yt-dlp-corresponding-source
          path: dist/downloader/source/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yt-dlp-build-failure
          path: .build/downloader/logs/*
          if-no-files-found: warn
          retention-days: 7
