name: Upload verified tool sources to draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag
        required: true
        type: string
        default: v2.4.0-preview
      ffmpeg_run:
        description: Successful FFmpeg build run
        required: true
        type: string
        default: '38143439058'
      ytdlp_run:
        description: Successful downloader build run
        required: true
        type: string
      ffmpeg_source_sha256:
        description: Locally approved corresponding FFmpeg source ZIP SHA256
        required: true
        type: string
      ytdlp_source_sha256:
        description: Locally approved corresponding downloader source ZIP SHA256
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: draft-tool-source-upload
  cancel-in-progress: false

jobs:
  upload-sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      FFMPEG_RUN: ${{ inputs.ffmpeg_run }}
      YTDLP_RUN: ${{ inputs.ytdlp_run }}
      FFMPEG_SOURCE_SHA256: ${{ inputs.ffmpeg_source_sha256 }}
      YTDLP_SOURCE_SHA256: ${{ inputs.ytdlp_source_sha256 }}
    steps:
      - name: Checkout trusted publication script
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check successful builds and existing draft release
        id: validate
        run: python3 scripts/publish-tool-sources.py preflight
      - name: Receive exact FFmpeg corresponding source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: crytomato529/MV-Downloader-Releases
          run-id: ${{ steps.validate.outputs.ffmpeg_run }}
          name: ffmpeg-corresponding-source
          path: artifacts/ffmpeg
      - name: Receive exact downloader corresponding source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          github-token: ${{ github.token }}
          repository: crytomato529/MV-Downloader-Releases
          run-id: ${{ steps.validate.outputs.ytdlp_run }}
          name: yt-dlp-corresponding-source
          path: artifacts/ytdlp
      - name: Verify both source ZIPs and upload without overwriting
        run: python3 scripts/publish-tool-sources.py upload
      - name: Preserve verified source upload receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tool-source-upload-receipt
          path: source-upload-report.json
          if-no-files-found: error
          retention-days: 30
